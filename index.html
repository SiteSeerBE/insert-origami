<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insert Origami</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Insert Origami</h1>
    <p class="lede">Turn one Sheet of paper or card into a three-Compartment board game Insert, with no glue.</p>
  </header>

  <main>
    <section class="inputs" aria-label="Box and paper">
      <form id="inputs" novalidate>
        <div class="field">
          <label for="length">Length <span class="unit">mm</span></label>
          <input id="length" name="length" type="number" inputmode="decimal" step="any" value="290">
        </div>
        <div class="field">
          <label for="width">Width <span class="unit">mm</span></label>
          <input id="width" name="width" type="number" inputmode="decimal" step="any" value="290">
        </div>
        <div class="field">
          <label for="insertHeight">Insert Height <span class="unit">mm</span></label>
          <input id="insertHeight" name="insertHeight" type="number" inputmode="decimal" step="any" value="40">
        </div>
        <div class="field">
          <label for="paperThickness">Paper thickness <span class="unit">mm</span></label>
          <input id="paperThickness" name="paperThickness" type="number" inputmode="decimal" step="any" value="0.3">
        </div>
      </form>
    </section>

    <section id="result" class="result">
      <p class="sheet-size">Sheet: <strong id="sheet-size"></strong></p>
      <div id="drawing" class="drawing"></div>
    </section>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
